<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图4-5 发票金额核验工具（v1）</title>
<style>
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background:#F7FAFC; color:#1A202C; margin:0; padding:24px; }
  .card { background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); max-width:720px; margin:0 auto; padding:24px; }
  h1 { font-size:20px; margin:0 0 6px; }
  .note { color:#4A5568; font-size:14px; margin-bottom:18px; }
  label { display:block; font-size:15px; margin:12px 0 4px; }
  input { width:100%; box-sizing:border-box; padding:8px 10px; font-size:16px; border:1px solid #CBD5E0; border-radius:6px; }
  button { margin-top:16px; padding:10px 18px; font-size:15px; background:#2B6CB0; color:#fff; border:none; border-radius:6px; cursor:pointer; }
  table { width:100%; border-collapse:collapse; margin-top:18px; font-size:15px; }
  th, td { border-bottom:1px solid #E2E8F0; padding:8px 6px; text-align:left; }
  .ok { color:#2F855A; font-weight:bold; }
  .bad { color:#C53030; font-weight:bold; }
  .tip { margin-top:14px; font-size:14px; color:#4A5568; line-height:1.7; }
</style>
</head>
<body>
<div class="card">
  <h1>图4-5 发票金额核验工具</h1>
  <div class="note">输入原票上的数字，检查“不含税金额 + 税额 = 价税合计”是否成立。仅用于练习数字核对，不能替代税务机关的发票查验。</div>

  <label for="total">价税合计（元，以原票为准）</label>
  <input id="total" type="number" step="0.01" value="233.21">

  <label for="rate">税率（%，以原票为准）</label>
  <input id="rate" type="number" step="0.01" value="3">

  <label for="tax">原票税额（元，以原票为准）</label>
  <input id="tax" type="number" step="0.01" value="6.79">

  <label for="net">原票不含税金额（元，以原票为准）</label>
  <input id="net" type="number" step="0.01" value="226.42">

  <button onclick="check()">开始核验</button>

  <div id="result"></div>
  <div class="tip">
    提示：计算结果保留两位小数，允许 0.01 元的四舍五入误差。若大模型识别的税率与原票不一致，税额和价税合计也会随之错误，应先修正税率，再重新核对。
  </div>
</div>

<script>
function check() {
  const total = parseFloat(document.getElementById('total').value);
  const rate  = parseFloat(document.getElementById('rate').value) / 100;
  const tax   = parseFloat(document.getElementById('tax').value);
  const net   = parseFloat(document.getElementById('net').value);
  const r = document.getElementById('result');
  if ([total, rate, tax, net].some(isNaN)) {
    r.innerHTML = '<p class="bad">请完整填写四个数字。</p>';
    return;
  }
  const calcNet = total / (1 + rate);
  const calcTax = calcNet * rate;
  const diffNet = Math.abs(calcNet - net);
  const diffTax = Math.abs(calcTax - tax);
  const sumOk   = Math.abs(net + tax - total) <= 0.01;
  const rows = [
    ['不含税金额', net.toFixed(2), calcNet.toFixed(2), diffNet <= 0.01],
    ['税额', tax.toFixed(2), calcTax.toFixed(2), diffTax <= 0.01],
    ['不含税金额 + 税额 = 价税合计', (net + tax).toFixed(2), total.toFixed(2), sumOk]
  ];
  let html = '<table><tr><th>核对项</th><th>原票数值</th><th>计算值</th><th>结论</th></tr>';
  for (const [name, a, b, ok] of rows) {
    html += `<tr><td>${name}</td><td>${a}</td><td>${b}</td><td class="${ok ? 'ok' : 'bad'}">${ok ? '一致' : '不一致，需查原票'}</td></tr>`;
  }
  html += '</table>';
  const allOk = rows.every(x => x[3]);
  html += `<p class="${allOk ? 'ok' : 'bad'}">${allOk ? '数字内部自洽，仍需与原票逐项比对并通过税务渠道查验。' : '存在不一致，请检查税率、金额和税额是否识别正确。'}</p>`;
  r.innerHTML = html;
}
check();
</script>
</body>
</html>
